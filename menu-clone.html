<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메뉴 클론 - 청소 가구 음식 운동</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #333333;
    --line: #eeeeee;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1e1e1e;
      --text: #eeeeee;
      --line: #333333;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1e1e1e;
    --text: #eeeeee;
    --line: #333333;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  .menu {
    display: flex;
    justify-content: flex-start;
    gap: 4px;
    padding: 12px 16px;
    overflow-x: auto;
    border-bottom: 1px solid var(--line);
  }
  .menu-item {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 56px;
    padding: 4px 6px;
    text-decoration: none;
    color: inherit;
    font-size: 12px;
  }
  .icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 6px;
  }
  .icon svg { width: 24px; height: 24px; }
  .label { white-space: nowrap; }
  .c-clean { background: #e6f7f0; color: #03c75a; }
  .c-furniture { background: #fff4e5; color: #ff8a00; }
  .c-food { background: #ffecec; color: #ff4d4d; }
  .c-sport { background: #e8f0ff; color: #2d6cdf; }
</style>
</head>
<body>
  <nav class="menu" aria-label="카테고리 메뉴">
    <a class="menu-item" href="#clean">
      <span class="icon c-clean" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3l-3 9"/><path d="M6 12h10l2 9H4z"/><path d="M8 12v-1a2 2 0 0 1 4 0v1"/></svg>
      </span>
      <span class="label">청소</span>
    </a>
    <a class="menu-item" href="#furniture">
      <span class="icon c-furniture" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v5"/><path d="M4 13a2 2 0 0 1 4 0v2h8v-2a2 2 0 0 1 4 0v4H4z"/><path d="M6 17v3M18 17v3"/></svg>
      </span>
      <span class="label">가구</span>
    </a>
    <a class="menu-item" href="#food">
      <span class="icon c-food" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v7a2 2 0 0 0 2 2v9"/><path d="M5 3v4a2 2 0 0 0 4 0V3"/><path d="M17 21V3c-2 0-3 2-3 5v4h3"/></svg>
      </span>
      <span class="label">음식</span>
    </a>
    <a class="menu-item" href="#sport">
      <span class="icon c-sport" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"/></svg>
      </span>
      <span class="label">운동</span>
    </a>
  </nav>
</body>
</html>
