<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인 관점으로 콘텐츠를 기획하고 비즈니스와 연결합니다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --accent: #ffe000;
    --tile-gap: 0px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111111;
      --fg: #f5f5f5;
      --accent: #ffe000;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111111;
    --fg: #f5f5f5;
    --accent: #ffe000;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Noto Sans KR", system-ui, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .hero {
    min-height: 62vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 96px 16px 64px;
  }
  .hero h1 {
    font-family: "Noto Serif KR", serif;
    font-weight: 400;
    font-size: clamp(30px, 5.2vw, 60px);
    line-height: 1.38;
    letter-spacing: -0.02em;
    word-break: keep-all;
  }
  .cta {
    margin-top: 56px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    height: 62px;
    padding: 0 40px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #111;
    font: inherit;
    font-size: 17px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,.12); }
  .cta:focus-visible { outline: 3px solid #111; outline-offset: 3px; }
  .cta svg { width: 20px; height: 20px; }

  /* Marquee strip */
  .strip {
    position: relative;
    overflow: hidden;
    width: 100%;
    height: clamp(260px, 40vw, 404px);
  }
  .track {
    display: flex;
    width: max-content;
    height: 100%;
    animation: scroll 40s linear infinite;
  }
  .strip:hover .track { animation-play-state: paused; }
  .tile {
    flex: 0 0 auto;
    width: clamp(200px, 22vw, 285px);
    height: 100%;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: "Noto Serif KR", serif;
    font-size: 28px;
    user-select: none;
  }
  .tile span { font-weight: 500; letter-spacing: .02em; text-align: center; padding: 12px; }

  .edit-btn {
    position: absolute;
    right: 24px;
    bottom: 24px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.5);
    background: rgba(20,20,20,.7);
    color: #fff;
    display: grid;
    place-items: center;
    cursor: pointer;
    z-index: 2;
  }
  .edit-btn svg { width: 22px; height: 22px; }

  @keyframes scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .track { animation: none; }
  }
  @media (max-width: 600px) {
    .hero { padding: 72px 16px 48px; }
    .cta { height: 54px; padding: 0 32px; font-size: 16px; }
  }
</style>
</head>
<body>
  <main>
    <section class="hero">
      <h1>디자인 관점으로 콘텐츠를<br>기획하고 비즈니스와 연결합니다</h1>
      <a class="cta" href="#projects">
        프로젝트 보기
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/>
        </svg>
      </a>
    </section>

    <section class="strip" id="projects" aria-label="프로젝트 갤러리">
      <div class="track" id="track"></div>
      <button class="edit-btn" aria-label="편집">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/>
        </svg>
      </button>
    </section>
  </main>

  <script>
    // 이미지 대신 같은 비율의 플레이스홀더 타일을 사용합니다.
    // 실제 이미지를 쓰려면 background-image 또는 <img>로 교체하세요.
    const items = [
      { label: "Design",      bg: "linear-gradient(180deg,#e9e6df 0 35%,#a8473d 35% 70%,#2d3a40 70%)" },
      { label: "SEOUL DESIGN", bg: "linear-gradient(135deg,#ffffff,#f3f3f3)", ink: "#111" },
      { label: "hey POP",     bg: "linear-gradient(180deg,#8d9a86 0 45%,#dcd9cf 45%)" },
      { label: "Living Now",  bg: "radial-gradient(circle at 50% 45%,#8fb8c9,#5b3b2a 70%)" },
      { label: "BOLD",        bg: "linear-gradient(135deg,#2a8fe0,#f5f5f5)", ink: "#6a2c9b" },
      { label: "LUXURY",      bg: "linear-gradient(180deg,#ffffff,#eeeeee)", ink: "#a0283c" },
      { label: "Living & Décor", bg: "radial-gradient(circle at 50% 50%,#c9a77a,#5a3b26)" }
    ];

    const track = document.getElementById("track");
    // 무한 루프를 위해 두 번 채웁니다 (translateX -50% 기준).
    const html = [...items, ...items].map(it => `
      <div class="tile" style="background:${it.bg}; color:${it.ink || "#fff"}">
        <span>${it.label}</span>
      </div>`).join("");
    track.innerHTML = html;
  </script>
</body>
</html>
